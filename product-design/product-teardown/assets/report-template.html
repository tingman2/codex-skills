<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{REPORT_TITLE}}</title>
  <style>
    :root{--bg:#f6f3ec;--paper:#fff;--ink:#2c261f;--muted:#746b61;--line:#ddd3c6;--fact:#246b46;--infer:#936000;--design:#6546a8;--unknown:#8a4545}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 Inter,"PingFang SC","Microsoft YaHei",sans-serif}
    nav{position:sticky;top:0;z-index:10;display:flex;gap:16px;overflow:auto;padding:11px 5vw;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line)}
    nav a{white-space:nowrap;color:var(--ink);text-decoration:none}.wrap{max-width:1380px;margin:auto;padding:36px 5vw 72px}
    h1{font-size:36px;margin:0 0 8px}h2{margin-top:48px;padding-bottom:8px;border-bottom:2px solid #b8613d}h3{margin:22px 0 8px}
    .lead,.card,.legend{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 4px 16px rgba(70,52,35,.04)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.table{overflow:auto;border-radius:12px;border:1px solid var(--line)}
    table{width:100%;border-collapse:collapse;background:var(--paper);min-width:760px}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#efe8dc}
    .fact,.infer,.design,.unknown,.ev{display:inline-block;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:700}.fact{background:#e6f3eb;color:var(--fact)}.infer{background:#fff0cb;color:var(--infer)}.design{background:#eee7fb;color:var(--design)}.unknown{background:#f8e5e5;color:var(--unknown)}.ev{background:#ece7df;color:#5d5145}
    .diagram{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.note{color:var(--muted);font-size:13px}
    @media(max-width:720px){h1{font-size:28px}.wrap{padding-left:18px;padding-right:18px}}
  </style>
</head>
<body>
  <nav>{{NAVIGATION}}</nav>
  <main class="wrap">
    <header><h1>{{REPORT_TITLE}}</h1><p class="note">{{SCOPE_AND_DATE}}</p></header>
    <section id="summary"><h2>执行摘要</h2><div class="lead">{{EXECUTIVE_SUMMARY}}</div></section>
    {{REPORT_SECTIONS}}
    <footer class="note">结论分级：页面/代码事实 · 合理推断 · 建议设计 · 未知</footer>
  </main>
</body>
</html>
